<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Warm Ivory/Emerald Glow Backdrop circle -->
  <circle cx="32" cy="32" r="30" fill="#174C3C"/>
  <circle cx="32" cy="32" r="28" fill="#F7F8F2" stroke="#D5AD58" stroke-width="1.5" stroke-opacity="0.7"/>
  
  <!-- Outer Plate Rim -->
  <circle cx="32" cy="32" r="23" fill="#FFFFFF" stroke="#E2ECE5" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="18" fill="#F7F8F2" stroke="#C6E6D2" stroke-width="1"/>
  
  <!-- Zero-Waste Circular Arrows -->
  <path d="M 32 10 A 22 22 0 0 1 54 32" stroke="#2E8059" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="54,29 57,35 51,35" fill="#2E8059" transform="rotate(30 54 32)"/>
  
  <path d="M 54 32 A 22 22 0 0 1 32 54" stroke="#174C3C" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="32,54 38,51 38,57" fill="#D5AD58"/>
  
  <path d="M 32 54 A 22 22 0 0 1 10 32" stroke="#D5AD58" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="10,35 7,29 13,29" fill="#2E8059" transform="rotate(-30 10 32)"/>

  <path d="M 10 32 A 22 22 0 0 1 32 10" stroke="#2E8059" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="32,10 26,13 26,7" fill="#2E8059"/>

  <!-- Botanical Leaf Symbol inside plate -->
  <path d="M 24 40 C 22 30, 28 20, 39 17 C 41 27, 34 37, 24 40 Z" fill="#2E8059" stroke="#174C3C" stroke-width="1"/>
  <path d="M 26 38 C 30 33, 34 27, 38 21" stroke="#C6E6D2" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Leaf Vein Accents -->
  <path d="M 30 33 Q 34 33 36 30" stroke="#C6E6D2" stroke-width="0.8" stroke-linecap="round"/>
  <path d="M 28 36 Q 31 36 33 34" stroke="#C6E6D2" stroke-width="0.8" stroke-linecap="round"/>
</svg>